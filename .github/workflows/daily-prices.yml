name: Daily prices (auto)

# Trading-day yfinance collectors (seasonality, valuation, VIX) in incremental
# `auto` mode: each run fetches only the recent tail per series and self-heals,
# so daily runs stay fast and converge to current data.
#
# Trigger is schedule + manual ONLY — never push/pull_request: this repo is
# public and the Supabase secret must never run in a fork PR context.
on:
  schedule:
    # 23:30 UTC, Mon-Fri — well after the US cash close in both EDT (19:30) and
    # EST (18:30), so the day's close is always available.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

jobs:
  collect:
    name: Collect daily prices
    runs-on: ubuntu-latest
    # Headroom over measured auto-mode durations: valuation ~7.5 min +
    # seasonality ~3 min + VIX < 1 min (~12 min), allowing for yfinance throttling.
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Optional feed override; falls back to the public deployed feed when the
      # secret is unset (empty), so this never breaks the asset-feed fetch.
      ASSETS_URL: ${{ secrets.ASSETS_URL || 'https://edgelabweb.vercel.app/api/assets' }}
      COLLECTOR_MODE: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Each collector is its own step; `if: always()` keeps the later collectors
      # running even if an earlier one fails (independent, self-healing), while a
      # failed step still marks the run red. Each script prints its own run
      # summary (rows touched per series + any failed tickers).
      - name: Seasonality (seasonality_prices)
        run: python scripts/fetch_seasonality_prices.py
      - name: Valuation (valuation_prices)
        if: always()
        run: python scripts/fetch_valuation_prices.py
      - name: VIX (vix_history)
        if: always()
        run: python scripts/fetch_vix_history.py
